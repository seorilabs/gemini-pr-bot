apiVersion: apps/v1
kind: Deployment
metadata:
  name: gemini-pr-bot
  namespace: apps
  labels:
    app.kubernetes.io/name: gemini-pr-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gemini-pr-bot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gemini-pr-bot
    spec:
      imagePullSecrets:
        - name: registry-pull-cred
      containers:
        - name: gemini-pr-bot
          image: registry.vzyx.xyz/seorilabs/gemini-pr-bot:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: GITHUB_ORG
              value: seorilabs
            - name: GEMINI_MODEL
              value: gemini-2.5-flash
            - name: BOT_MENTIONS
              value: "@gemini-cli,@gemini"
            - name: TRUSTED_ASSOCIATIONS
              value: "OWNER,MEMBER,COLLABORATOR"
            - name: ALLOW_PUBLIC_REPOS
              value: "false"
            - name: AUTO_REVIEW_ON_OPEN
              value: "true"
            - name: AUTO_REVIEW_ON_SYNCHRONIZE
              value: "false"
            - name: LOG_LEVEL
              value: info
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: gemini-pr-bot-secrets
                  key: GITHUB_APP_ID
            - name: GITHUB_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-pr-bot-secrets
                  key: GITHUB_PRIVATE_KEY
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: gemini-pr-bot-secrets
                  key: GITHUB_WEBHOOK_SECRET
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-pr-bot-secrets
                  key: GEMINI_API_KEY
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: gemini-pr-bot
  namespace: apps
  labels:
    app.kubernetes.io/name: gemini-pr-bot
spec:
  selector:
    app.kubernetes.io/name: gemini-pr-bot
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gemini-pr-bot
  namespace: apps
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: public
  tls:
    - secretName: gemini-pr-bot-vzyx-xyz-tls
      hosts:
        - gemini-pr-bot.vzyx.xyz
  rules:
    - host: gemini-pr-bot.vzyx.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gemini-pr-bot
                port:
                  name: http

