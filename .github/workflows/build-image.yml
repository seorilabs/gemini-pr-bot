name: Build and push image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "추가로 게시할 이미지 태그. 비우면 commit SHA를 사용합니다."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-seori-pr-bot-image
  cancel-in-progress: false

env:
  IMAGE: registry.vzyx.xyz/seorilabs/seori-pr-bot

jobs:
  build-and-push:
    name: ARM64 이미지 빌드 및 푸시
    runs-on: seorilabs-rpi-arm64-dind
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: remote
          endpoint: tcp://buildkitd.platform.svc.cluster.local:1234

      - name: Log in to the private registry
        uses: docker/login-action@v4
        with:
          registry: registry.vzyx.xyz
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Resolve image tag
        id: image
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG:-${GITHUB_SHA}}"
          if [[ ! "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "유효하지 않은 이미지 태그입니다: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "${IMAGE}:${tag}" > /tmp/image-tags
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "${IMAGE}:latest" >> /tmp/image-tags
            echo "pushes_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "pushes_latest=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "tags<<EOF"
            cat /tmp/image-tags
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.tags }}

      - name: Publish summary
        env:
          TAG: ${{ steps.image.outputs.tag }}
          PUSHES_LATEST: ${{ steps.image.outputs.pushes_latest }}
        run: |
          {
            echo "## 이미지 게시 완료"
            echo
            echo "- 이미지: \`${IMAGE}:${TAG}\`"
            echo "- 플랫폼: \`linux/arm64\`"
            echo "- 실행 방식: 수동 GitHub Actions"
            echo "- latest 갱신: \`${PUSHES_LATEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
