name: Org branch cleanup

# Weekly org-wide cleanup of stale remote branches whose PR was already merged.
# Prevention (delete_branch_on_merge=true) is re-asserted on every repo each run,
# so this also self-heals newly created repos. See scripts/cleanup-stale-branches.sh
# for the exact (conservative) delete rule.
#
# Requires an org-scoped token in secret BRANCH_CLEANUP_TOKEN with:
#   - contents: write        (delete branch refs)
#   - administration: write  (set delete_branch_on_merge)
# A fine-grained PAT (all repos, those two perms) or a GitHub App token works.

on:
  schedule:
    - cron: "0 18 * * 6" # Sat 18:00 UTC = Sun 03:00 KST (low-activity window)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true=preview only, false=actually delete"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: org-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete stale merged branches
    runs-on: seorilabs-rpi-arm64
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Preflight (gh available)
        run: gh --version
        env:
          GH_TOKEN: ${{ secrets.BRANCH_CLEANUP_TOKEN }}

      - name: Cleanup stale merged branches
        env:
          GH_TOKEN: ${{ secrets.BRANCH_CLEANUP_TOKEN }}
          ORG: seorilabs
          # Scheduled runs enforce (delete); manual runs preview unless dry_run=false.
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
          ENABLE_AUTODELETE: "true"
        run: bash scripts/cleanup-stale-branches.sh
