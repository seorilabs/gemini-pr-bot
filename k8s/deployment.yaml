apiVersion: apps/v1
kind: Deployment
metadata:
  name: gemini-pr-bot
  namespace: apps
  labels:
    app.kubernetes.io/name: gemini-pr-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gemini-pr-bot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gemini-pr-bot
    spec:
      nodeSelector:
        kubernetes.io/hostname: rpi5
      securityContext:
        fsGroup: 10001
      imagePullSecrets:
        - name: registry-pull-cred
      initContainers:
        - name: prepare-gemini-home
          image: busybox:1.37.0
          command:
            - sh
            - -c
          args:
            - |
              set -eu
              mkdir -p /gemini-home/.gemini
              cp /gemini-cli-secret/oauth_creds.json /gemini-home/.gemini/oauth_creds.json
              cp /gemini-cli-secret/google_accounts.json /gemini-home/.gemini/google_accounts.json
              cp /gemini-cli-secret/settings.json /gemini-home/.gemini/settings.json
              chown -R 10001:10001 /gemini-home
              chmod 700 /gemini-home/.gemini
              chmod 600 /gemini-home/.gemini/*
          volumeMounts:
            - name: gemini-home
              mountPath: /gemini-home
            - name: gemini-cli-secret
              mountPath: /gemini-cli-secret
              readOnly: true
      containers:
        - name: gemini-pr-bot
          image: registry.vzyx.xyz/seorilabs/gemini-pr-bot:latest
          imagePullPolicy: Always
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: GITHUB_ORG
              value: seorilabs
            - name: GEMINI_PROVIDER
              value: cli
            - name: GEMINI_CLI_COMMAND
              value: /app/node_modules/.bin/gemini
            - name: HOME
              value: /home/app
            - name: BOT_MENTIONS
              value: "@gemini-cli,@gemini,@seorilabs-gemini-pr-bot"
            - name: TRUSTED_ASSOCIATIONS
              value: "OWNER,MEMBER,COLLABORATOR"
            - name: ALLOW_PUBLIC_REPOS
              value: "false"
            - name: AUTO_REVIEW_ON_OPEN
              value: "true"
            - name: AUTO_REVIEW_ON_SYNCHRONIZE
              value: "false"
            - name: LOG_LEVEL
              value: info
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: gemini-pr-bot-secrets
                  key: GITHUB_APP_ID
            - name: GITHUB_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-pr-bot-secrets
                  key: GITHUB_PRIVATE_KEY
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: gemini-pr-bot-secrets
                  key: GITHUB_WEBHOOK_SECRET
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: gemini-home
              mountPath: /home/app
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: gemini-home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: gemini-cli-secret
          secret:
            secretName: gemini-pr-bot-cli-oauth
            items:
              - key: oauth_creds.json
                path: oauth_creds.json
              - key: google_accounts.json
                path: google_accounts.json
              - key: settings.json
                path: settings.json
---
apiVersion: v1
kind: Service
metadata:
  name: gemini-pr-bot
  namespace: apps
  labels:
    app.kubernetes.io/name: gemini-pr-bot
spec:
  selector:
    app.kubernetes.io/name: gemini-pr-bot
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gemini-pr-bot
  namespace: apps
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: public
  tls:
    - secretName: gemini-pr-bot-vzyx-xyz-tls
      hosts:
        - gemini-pr-bot.vzyx.xyz
  rules:
    - host: gemini-pr-bot.vzyx.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gemini-pr-bot
                port:
                  name: http
