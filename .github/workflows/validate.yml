name: Validate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-lint-and-tests:
    name: PR lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: seori_status_reconciliation_test
        ports:
          - "127.0.0.1:33306:3306"
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          check-latest: false
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        env:
          SEORI_STATUS_TEST_MYSQL_PORT: "33306"
        run: npm run check

      - name: Build
        run: npm run build
