apiVersion: apps/v1
kind: Deployment
metadata:
  name: gemini-pr-bot
  namespace: apps
  labels:
    app.kubernetes.io/name: gemini-pr-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gemini-pr-bot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gemini-pr-bot
    spec:
      terminationGracePeriodSeconds: 260
      nodeSelector:
        kubernetes.io/hostname: rpi5
      securityContext:
        fsGroup: 10001
      imagePullSecrets:
        - name: registry-pull-cred
      initContainers:
        - name: prepare-gemini-home
          image: busybox:1.37.0
          command:
            - sh
            - -c
          args:
            - |
              set -eu
              mkdir -p /gemini-home/.gemini
              cp /gemini-cli-secret/oauth_creds.json /gemini-home/.gemini/oauth_creds.json
              cp /gemini-cli-secret/google_accounts.json /gemini-home/.gemini/google_accounts.json
              cp /gemini-cli-secret/settings.json /gemini-home/.gemini/settings.json
              chown -R 10001:10001 /gemini-home
              chmod 700 /gemini-home/.gemini
              chmod 600 /gemini-home/.gemini/*
          volumeMounts:
            - name: gemini-home
              mountPath: /gemini-home
            - name: gemini-cli-secret
              mountPath: /gemini-cli-secret
              readOnly: true
      containers:
        - name: gemini-pr-bot
          image: registry.vzyx.xyz/seorilabs/gemini-pr-bot:latest
          imagePullPolicy: Always
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: GITHUB_ORG
              value: seorilabs
            - name: WORKFLOW_STORE
              value: mysql
            - name: WORKFLOW_POLL_INTERVAL_MS
              value: "5000"
            - name: WORKFLOW_LEASE_MS
              value: "600000"
            - name: WORKFLOW_MAX_ATTEMPTS
              value: "3"
            - name: CI_INITIAL_WAIT_MS
              value: "60000"
            - name: CI_RECHECK_INTERVAL_MS
              value: "60000"
            - name: CI_RECHECK_TIMEOUT_MS
              value: "1200000"
            - name: SHUTDOWN_GRACE_MS
              value: "240000"
            - name: MYSQL_HOST
              value: mysql.data.svc.cluster.local
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_DATABASE
              value: base
            - name: GEMINI_PROVIDER
              value: cli
            - name: GEMINI_MODEL
              value: gemini-3-flash-preview
            - name: GEMINI_CLI_COMMAND
              value: /app/node_modules/.bin/gemini
            - name: AI_REVIEW_PROVIDERS
              value: gemini,copilot,cursor
            - name: AI_REVIEW_PROVIDER_WEIGHTS
              value: gemini:100,copilot:0,cursor:0
            - name: AI_REVIEW_PROVIDER_FALLBACK_ORDER
              value: gemini,cursor,copilot
            - name: AI_REVIEW_PROVIDER_COOLDOWN_MS
              value: "300000"
            - name: COPILOT_CLI_COMMAND
              value: /app/node_modules/.bin/copilot
            - name: COPILOT_CLI_TIMEOUT_MS
              value: "180000"
            - name: COPILOT_MODEL
              value: auto
            - name: CURSOR_CLI_COMMAND
              value: /usr/local/bin/agent
            - name: CURSOR_CLI_TIMEOUT_MS
              value: "180000"
            - name: CURSOR_MODEL
              value: gpt-5.2
            - name: DEEP_REPO_CONTEXT_MODE
              value: auto
            - name: DEEP_REPO_CONTEXT_TIMEOUT_MS
              value: "60000"
            - name: DEEP_REPO_CONTEXT_MAX_FILES
              value: "40"
            - name: DEEP_REPO_CONTEXT_MAX_BYTES
              value: "80000"
            - name: HOME
              value: /home/app
            - name: BOT_MENTIONS
              value: "@seorilabs-seori,@seorilabs-gemini-pr-bot,@seori-bot,@seori,@gemini-cli,@gemini"
            - name: TRUSTED_ASSOCIATIONS
              value: "OWNER,MEMBER,COLLABORATOR"
            - name: ALLOW_PUBLIC_REPOS
              value: "false"
            - name: AUTO_REVIEW_ON_OPEN
              value: "true"
            - name: AUTO_REVIEW_ON_SYNCHRONIZE
              value: "true"
            - name: AUTO_REVIEW_IGNORED_REPOSITORIES
              value: seorilabs/gemini-pr-bot
            - name: APPROVAL_TELEGRAM_NOTIFY_ENABLED
              value: "true"
            - name: QUOTA_TELEGRAM_NOTIFY_ENABLED
              value: "true"
            - name: QUOTA_TELEGRAM_SUMMARY_INTERVAL_MS
              value: "3600000"
            - name: STALE_REVIEW_CLOSE_ENABLED
              value: "true"
            - name: STALE_REVIEW_THRESHOLD_MS
              value: "86400000"
            - name: STALE_REVIEW_SCAN_INTERVAL_MS
              value: "1800000"
            - name: STALE_REVIEW_MAX_PRS_PER_SCAN
              value: "100"
            - name: STALE_REVIEW_IGNORED_REPOSITORIES
              value: seorilabs/gemini-pr-bot
            - name: NATS_SERVER_URL
              value: nats://nats.data.svc.cluster.local:4222
            - name: APPROVAL_TELEGRAM_BOT
              value: seolee_bot
            - name: APPROVAL_TELEGRAM_CHANNEL
              value: syous
            - name: LOG_LEVEL
              value: info
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-app-cred
                  key: username
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-app-cred
                  key: password
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: gemini-pr-bot-secrets
                  key: GITHUB_APP_ID
            - name: GITHUB_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-pr-bot-secrets
                  key: GITHUB_PRIVATE_KEY
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: gemini-pr-bot-secrets
                  key: GITHUB_WEBHOOK_SECRET
            - name: COPILOT_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gemini-pr-bot-provider-secrets
                  key: COPILOT_GITHUB_TOKEN
                  optional: true
            - name: CURSOR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-pr-bot-provider-secrets
                  key: CURSOR_API_KEY
                  optional: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 2Gi
          volumeMounts:
            - name: gemini-home
              mountPath: /home/app
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: gemini-home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: gemini-cli-secret
          secret:
            secretName: gemini-pr-bot-cli-oauth
            items:
              - key: oauth_creds.json
                path: oauth_creds.json
              - key: google_accounts.json
                path: google_accounts.json
              - key: settings.json
                path: settings.json
---
apiVersion: v1
kind: Service
metadata:
  name: gemini-pr-bot
  namespace: apps
  labels:
    app.kubernetes.io/name: gemini-pr-bot
spec:
  selector:
    app.kubernetes.io/name: gemini-pr-bot
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gemini-pr-bot
  namespace: apps
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: public
  tls:
    - secretName: gemini-pr-bot-vzyx-xyz-tls
      hosts:
        - gemini-pr-bot.vzyx.xyz
  rules:
    - host: gemini-pr-bot.vzyx.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gemini-pr-bot
                port:
                  name: http
